
name: Build Traductor.AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TraductorAI_GitHub_APK

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Install Android platform
        run: npm install @capacitor/android@^7.4.3

      - name: Create Android project
        run: npx cap add android

      - name: Sync application files
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: TraductorAI_GitHub_APK/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TraductorAI-debug-apk
          path: TraductorAI_GitHub_APK/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
